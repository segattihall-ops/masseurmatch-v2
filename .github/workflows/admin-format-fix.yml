name: Admin Format Fix

on:
  push:
    branches:
      - fix/admin-production-hardening

permissions:
  contents: write

jobs:
  format-admin:
    if: ${{ !contains(github.event.head_commit.message, '[skip-admin-format]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-production-hardening
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format touched Admin files
        run: |
          pnpm exec prettier --write \
            apps/admin/src/app/admin/audit-log/page.tsx \
            apps/admin/src/app/admin/people/page.tsx \
            apps/admin/src/app/admin/photos/page.tsx \
            apps/admin/src/app/admin/verifications/actions.ts \
            apps/admin/src/app/admin/verifications/page.tsx \
            apps/admin/src/app/admin/verifications/queue.tsx \
            apps/admin/src/app/admin/verifications/manual/page.tsx \
            apps/admin/src/components/dashboard/admin-sidebar.tsx
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "Already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin
          git commit -m "style(admin): format production hardening [skip-admin-format]"
          git push origin HEAD:fix/admin-production-hardening
