name: Admin parity production smoke once

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - name: Check live Admin routes and billing health
        shell: bash
        run: |
          set -euo pipefail

          check_admin_guard() {
            local name="$1" url="$2"
            local body status effective
            body="$(mktemp)"
            read -r status effective < <(curl -sS -L --max-redirs 8 --connect-timeout 10 --max-time 40 -o "$body" -w '%{http_code} %{url_effective}\n' "$url")
            echo "$name status=$status effective=$effective"
            if [ "$status" != "200" ]; then
              echo "::error::$name expected 200 after auth redirect, got $status"
              head -c 1500 "$body" || true
              exit 1
            fi
            if [[ "$effective" != *"/sign-in"* ]]; then
              echo "::error::$name did not redirect logged-out visitor to sign-in"
              exit 1
            fi
            grep -Fqi 'Admin sign in' "$body"
          }

          check_admin_guard "Admin analytics" "https://admin.masseurmatch.com/analytics"
          check_admin_guard "Admin billing" "https://admin.masseurmatch.com/billing"
          check_admin_guard "Admin people" "https://admin.masseurmatch.com/people"
          check_admin_guard "Admin person detail" "https://admin.masseurmatch.com/people/00000000-0000-0000-0000-000000000000"

          billing_body="$(mktemp)"
          billing_status="$(curl -sS --connect-timeout 10 --max-time 40 -o "$billing_body" -w '%{http_code}' 'https://dashboard.masseurmatch.com/api/health/billing')"
          echo "billing health status=$billing_status"
          cat "$billing_body"
          echo
          [ "$billing_status" = "200" ]
          grep -Fq '"ok":true' "$billing_body"
          grep -Fq '"billing":"ready"' "$billing_body"

          echo "Admin parity production smoke passed."
