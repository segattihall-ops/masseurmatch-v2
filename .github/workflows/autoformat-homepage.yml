name: Autoformat homepage fix

on:
  push:
    branches:
      - feature/homepage-photo-motion-fix

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/homepage-photo-motion-fix

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format
      - run: |
          if git diff --quiet; then
            echo "Already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/app/page.tsx apps/web/src/app/globals.css apps/web/src/components/therapist-card.tsx packages/ui/src/components/motion/index.ts packages/ui/src/components/motion/scroll-motion.tsx
          git commit -m "style(home): apply Prettier"
          git push origin HEAD:feature/homepage-photo-motion-fix
