name: Billing health smoke once

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - name: Check live billing health
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          status="$(curl -sS --connect-timeout 10 --max-time 30 -o "$body" -w '%{http_code}' 'https://dashboard.masseurmatch.com/api/health/billing')"
          echo "billing health status=$status"
          cat "$body"
          echo
          if [ "$status" != "200" ]; then
            echo "::error::Live billing is not ready; expected 200, got $status"
            exit 1
          fi
          grep -Fq '"ok":true' "$body"
          grep -Fq '"billing":"ready"' "$body"
