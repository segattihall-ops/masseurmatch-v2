name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  verify:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        task: [lint, typecheck, build, test]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ${{ matrix.task }}
        run: pnpm ${{ matrix.task }}

  format:
    name: format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

  pr33-fix-artifact:
    name: pr33-fix-artifact
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 33
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply targeted source fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('apps/web/src/app/search/search-controls.tsx')
          text = path.read_text()
          text = text.replace('useApproximateLocation', 'resolveApproximateLocation')
          text = text.replace('useMyLocation', 'locateUser')
          path.write_text(text)

          path = Path('apps/web/src/app/api/analytics/legacy/route.ts')
          text = path.read_text()
          text = text.replace(
              'function compactFilters(value: unknown): Record<string, unknown> | null {',
              'function compactFilters(value: unknown): Record<string, string | boolean | number> | null {',
          )
          text = text.replace(
              '  const out: Record<string, unknown> = {};',
              '  const out: Record<string, string | boolean | number> = {};',
          )
          path.write_text(text)

          path = Path('apps/web/src/components/public-profile-page.tsx')
          text = path.read_text()
          text = text.replace('  profilePath,\n', '')
          replacement = '''  const socialLinks = Object.entries(asRecords(supplement.social_media)[0] ?? {}).filter(
            ([, value]) => typeof value === "string" && /^https?:\\/\\//.test(value),
          ) as Array<[string, string]>;'''
          if 'const socialLinks = Object.entries' not in text:
              pattern = r'  const socialLinks = asRecords\(supplement\.social_media\)\.length\n.*?\n\s*: \[\];'
              text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit('socialLinks block not found')
          path.write_text(text)

          path = Path('packages/db/package.json')
          text = path.read_text()
          marker = '    "./actions/directory-config": "./actions/directory-config.ts",\n'
          export = '    "./actions/public-profile": "./actions/public-profile.ts",\n'
          if export not in text:
              if marker not in text:
                  raise SystemExit('db exports marker not found')
              text = text.replace(marker, marker + export)
          path.write_text(text)
          PY

      - name: Format affected files
        run: |
          pnpm prettier --write \
            'apps/web/src/app/[state]/[city]/[slug]/page.tsx' \
            'apps/web/src/app/api/analytics/legacy/route.ts' \
            'apps/web/src/app/api/profile-actions/route.ts' \
            'apps/web/src/app/api/profile-reports/route.ts' \
            'apps/web/src/app/api/reverse-geocode/route.ts' \
            'apps/web/src/app/search/page.tsx' \
            'apps/web/src/app/search/search-controls.tsx' \
            'apps/web/src/components/public-profile-page.tsx' \
            'packages/db/actions/directory-config.ts' \
            'packages/db/actions/public-profile.ts' \
            'packages/db/package.json'

      - name: Upload corrected files
        uses: actions/upload-artifact@v4
        with:
          name: pr33-corrected-files-full
          if-no-files-found: error
          retention-days: 1
          path: |
            apps/web/src/app
            apps/web/src/components/public-profile-page.tsx
            packages/db/actions/directory-config.ts
            packages/db/actions/public-profile.ts
            packages/db/package.json

      - name: Verify corrected tree
        run: |
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build

  secrets:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail if any .env file is tracked
        run: |
          tracked="$(git ls-files -- '.env' '.env.*' ':!:.env.example')"
          if [ -n "$tracked" ]; then
            echo "::error::Tracked env files found:"
            echo "$tracked"
            exit 1
          fi
          echo "No tracked .env files."

      - name: Fail if .env.example carries values
        run: |
          offenders="$(grep -nE '^[A-Za-z_][A-Za-z0-9_]*=.+' .env.example || true)"
          if [ -n "$offenders" ]; then
            echo "::error::.env.example must document names only, never values:"
            echo "$offenders"
            exit 1
          fi
          echo ".env.example contains names only."

      - name: Scan tracked files for credential-shaped strings
        run: bash scripts/scan-secrets.sh

  ci:
    name: ci
    if: always()
    needs: [verify, format, secrets]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any dependency failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "All CI checks passed."
