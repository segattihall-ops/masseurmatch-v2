name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  preview-smoke:
    name: preview-smoke
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feature/public-profile-search-parity' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/public-profile-search-parity
          fetch-depth: 0

      - name: Verify requested preview behavior
        shell: bash
        env:
          WEB: https://masseurmatch-v2-git-feature-public-profile-se-330e08-mm-website.vercel.app
          DASHBOARD: https://masseurmatch-v2-kftd-git-feature-public-profi-bd2022-mm-website.vercel.app
        run: |
          set -euo pipefail
          page="$(mktemp)"
          ready=0
          for attempt in $(seq 1 30); do
            status="$(curl -sS -L --connect-timeout 10 --max-time 30 -o "$page" -w '%{http_code}' "$WEB/compare" || true)"
            if [ "$status" = "200" ] && grep -Fq "Compare MasseurMatch with other massage directories" "$page"; then
              ready=1
              break
            fi
            sleep 10
          done
          if [ "$ready" != "1" ]; then
            echo "::error::Current branch preview did not become ready."
            head -c 1800 "$page" || true
            exit 1
          fi

          require_page() {
            local name="$1" url="$2"
            shift 2
            local body status
            body="$(mktemp)"
            status="$(curl -sS -L --connect-timeout 10 --max-time 40 -o "$body" -w '%{http_code}' "$url")"
            echo "$name status=$status"
            [ "$status" = "200" ] || { head -c 1800 "$body"; exit 1; }
            for marker in "$@"; do
              grep -Fqi "$marker" "$body" || { echo "::error::$name missing marker: $marker"; exit 1; }
            done
          }

          require_page "compare hub" "$WEB/compare" "MasseurFinder" "RentMasseur" "Most compared"
          require_page "search" "$WEB/search" "Find near me" "Nearby radius" "Featured profiles" "Offers & discounts" "Nearest" "Most reviewed"

          headers="$(curl -sS -I --connect-timeout 10 --max-time 30 "$WEB/search" | tr -d '\r' | tr '[:upper:]' '[:lower:]')"
          echo "$headers" | grep -F "permissions-policy:" | grep -F "geolocation=(self)"

          require_page "Bruno public profile" "$WEB/tx/dallas/bruno-3890ba48" "Ask Knotty" "Want to contact Bruno?" "Therapists near Dallas" "Read review" "Service area" "openstreetmap.org"

          concierge_body="$(mktemp)"
          concierge_status="$(curl -sS --connect-timeout 10 --max-time 60 -o "$concierge_body" -w '%{http_code}' -X POST -H 'content-type: application/json' --data '{"message":"What city is this provider in?","profileId":"3890ba48-4376-4609-9b1c-f0f9cf5e7634"}' "$WEB/api/concierge")"
          echo "profile Knotty status=$concierge_status"
          [ "$concierge_status" = "200" ] && grep -Fq '"reply"' "$concierge_body" || { cat "$concierge_body"; exit 1; }

          video_body="$(mktemp)"
          video_status="$(curl -sS --connect-timeout 10 --max-time 30 -o "$video_body" -w '%{http_code}' -X POST "$DASHBOARD/api/uploads/video")"
          echo "anonymous video upload status=$video_status"
          case "$video_status" in 401|403) ;; *) cat "$video_body"; exit 1 ;; esac

      - name: Remove temporary smoke tooling after pass
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/profile-search-preview-smoke-once.yml
          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove profile search preview smoke"
          git push origin HEAD:feature/public-profile-search-parity

  verify:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        task: [lint, typecheck, build, test]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run ${{ matrix.task }}
        run: pnpm ${{ matrix.task }}

  format:
    name: format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format:check

  secrets:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fail if any .env file is tracked
        run: |
          tracked="$(git ls-files -- '.env' '.env.*' ':!:.env.example')"
          if [ -n "$tracked" ]; then
            echo "::error::Tracked env files found:"
            echo "$tracked"
            exit 1
          fi
      - name: Fail if .env.example carries values
        run: |
          offenders="$(grep -nE '^[A-Za-z_][A-Za-z0-9_]*=.+' .env.example || true)"
          if [ -n "$offenders" ]; then
            echo "::error::.env.example must document names only, never values:"
            echo "$offenders"
            exit 1
          fi
      - name: Scan tracked files for credential-shaped strings
        run: bash scripts/scan-secrets.sh

  ci:
    name: ci
    if: always()
    needs: [verify, format, secrets]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any dependency failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "All CI checks passed."
