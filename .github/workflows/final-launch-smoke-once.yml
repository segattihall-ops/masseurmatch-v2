name: Final production launch smoke once

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - name: Smoke final production surfaces
        shell: bash
        run: |
          set -euo pipefail

          get_200() {
            local name="$1" url="$2" marker="$3"
            local body status
            body="$(mktemp)"
            status="$(curl -sS -L --max-redirs 8 --connect-timeout 10 --max-time 40 -o "$body" -w '%{http_code}' "$url")"
            echo "$name status=$status"
            if [ "$status" != "200" ]; then
              echo "::error::$name expected 200, got $status"
              head -c 1500 "$body" || true
              exit 1
            fi
            if [ -n "$marker" ] && ! grep -Fqi "$marker" "$body"; then
              echo "::error::$name missing expected marker: $marker"
              head -c 1500 "$body" || true
              exit 1
            fi
          }

          post_not_500() {
            local name="$1" url="$2" data="$3"
            local body status
            body="$(mktemp)"
            status="$(curl -sS --connect-timeout 10 --max-time 40 -o "$body" -w '%{http_code}' -X POST -H 'content-type: application/json' --data "$data" "$url")"
            echo "$name status=$status"
            case "$status" in
              4??) ;;
              *)
                echo "::error::$name expected a client-error response for invalid input, got $status"
                head -c 1500 "$body" || true
                exit 1
                ;;
            esac
          }

          get_200 "homepage" "https://www.masseurmatch.com/" "MasseurMatch"
          get_200 "mobile menu SSR" "https://www.masseurmatch.com/" "Open menu"
          get_200 "search" "https://www.masseurmatch.com/search" "Browse massage therapists"
          get_200 "city" "https://www.masseurmatch.com/ca/san-francisco" "San Francisco"
          get_200 "real profile" "https://www.masseurmatch.com/ca/san-francisco/giovanni-san-francisco" "Giovanni"
          get_200 "robots" "https://www.masseurmatch.com/robots.txt" "User-agent"
          get_200 "sitemap" "https://www.masseurmatch.com/sitemap.xml" "urlset"

          get_200 "dashboard sign-in" "https://dashboard.masseurmatch.com/sign-in" "Sign in"
          get_200 "dashboard sign-up" "https://dashboard.masseurmatch.com/sign-up" "Create"
          get_200 "verify-id auth redirect" "https://dashboard.masseurmatch.com/verify-id" "Sign in"

          get_200 "admin sign-in" "https://admin.masseurmatch.com/sign-in" "Admin sign in"
          get_200 "admin auth redirect" "https://admin.masseurmatch.com/verifications" "Admin sign in"

          post_not_500 "profile reports invalid input" "https://www.masseurmatch.com/api/profile-reports" '{}'
          post_not_500 "profile actions invalid input" "https://www.masseurmatch.com/api/profile-actions" '{}'

          webhook_body="$(mktemp)"
          webhook_status="$(curl -sS --connect-timeout 10 --max-time 40 -o "$webhook_body" -w '%{http_code}' -X POST -H 'content-type: application/json' --data '{}' 'https://dashboard.masseurmatch.com/api/webhooks/paypal')"
          echo "PayPal unsigned webhook status=$webhook_status"
          case "$webhook_status" in
            400|401|403) ;;
            *)
              echo "::error::PayPal webhook did not fail closed on unsigned input: $webhook_status"
              head -c 1500 "$webhook_body" || true
              exit 1
              ;;
          esac

          billing_body="$(mktemp)"
          billing_status="$(curl -sS --connect-timeout 10 --max-time 40 -o "$billing_body" -w '%{http_code}' 'https://dashboard.masseurmatch.com/api/health/billing')"
          echo "billing health status=$billing_status"
          cat "$billing_body"
          echo
          if [ "$billing_status" != "200" ]; then
            echo "::error::Billing health expected 200, got $billing_status"
            exit 1
          fi
          grep -Fq '"ok":true' "$billing_body"
          grep -Fq '"billing":"ready"' "$billing_body"

          echo "Final production smoke passed."
