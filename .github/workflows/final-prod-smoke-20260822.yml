name: Final production smoke 2026-08-22

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      TEAM_ID: team_srSjjkFDYeFA6HpxgpvxPgox
    steps:
      - name: Locate current custom-domain ownership
        shell: bash
        run: |
          set -euo pipefail

          echo '=== all project domains for masseurmatch.com ==='
          domain_data="$(curl -fsS -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v1/domains/masseurmatch.com/project-domains?teamId=$TEAM_ID&limit=100")"
          printf '%s' "$domain_data" | jq '.projectDomains[] | {name,apexName,projectId,gitBranch,redirect,redirectStatusCode,verified}'

          echo '=== owning projects ==='
          printf '%s' "$domain_data" | jq -r '.projectDomains[].projectId' | sort -u | while read -r project_id; do
            [ -n "$project_id" ] || continue
            curl -fsS -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v9/projects/$project_id?teamId=$TEAM_ID" \
              | jq '{name,id,rootDirectory,link:{org:.link.org,repo:.link.repo,productionBranch:.link.productionBranch}}'
          done

          echo '=== target v2 project ==='
          curl -fsS -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v9/projects/masseurmatch-v2?teamId=$TEAM_ID" \
            | jq '{name,id,rootDirectory,link:{org:.link.org,repo:.link.repo,productionBranch:.link.productionBranch}}'
