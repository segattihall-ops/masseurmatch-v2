name: Final production smoke 2026-08-22

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - name: Diagnose production domain deployment
        shell: bash
        run: |
          set -euo pipefail

          echo '=== DNS ==='
          dig +short CNAME www.masseurmatch.com || true
          dig +short A www.masseurmatch.com || true
          dig +short CNAME masseurmatch.com || true
          dig +short A masseurmatch.com || true

          inspect() {
            local name="$1" url="$2"
            local headers body status
            headers="$(mktemp)"
            body="$(mktemp)"
            status="$(curl -sS -L --max-redirs 8 --connect-timeout 10 --max-time 45 -D "$headers" -o "$body" -w '%{http_code}' "$url")"
            echo "=== $name status=$status ==="
            grep -Ei '^(x-vercel-|server:|age:|cache-control:|location:)' "$headers" || true
            echo -n 'deployment tokens: '
            grep -Eo 'dpl_[A-Za-z0-9]+' "$body" | sort -u | head -10 | tr '\n' ' ' || true
            echo
            echo -n 'body marker: '
            grep -Eo 'Page not found|Massage therapists in San Francisco|Giovanni|Open menu' "$body" | head -5 | tr '\n' ' ' || true
            echo
          }

          inspect homepage https://www.masseurmatch.com/
          inspect canonical-city https://www.masseurmatch.com/ca/san-francisco
          inspect search https://www.masseurmatch.com/search
          inspect dashboard https://dashboard.masseurmatch.com/sign-in
          inspect admin https://admin.masseurmatch.com/sign-in
