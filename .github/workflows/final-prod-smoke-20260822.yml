name: Final production smoke 2026-08-22

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    env:
      HAS_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}
      HAS_VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID != '' }}
      HAS_VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID != '' }}
      HAS_VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID != '' }}
    steps:
      - name: Check deploy credential availability without exposing values
        shell: bash
        run: |
          set -euo pipefail
          echo "VERCEL_TOKEN present=$HAS_VERCEL_TOKEN"
          echo "VERCEL_ORG_ID present=$HAS_VERCEL_ORG_ID"
          echo "VERCEL_PROJECT_ID present=$HAS_VERCEL_PROJECT_ID"
          echo "VERCEL_TEAM_ID present=$HAS_VERCEL_TEAM_ID"

      - name: Diagnose production domain deployment
        shell: bash
        run: |
          set -euo pipefail
          inspect() {
            local name="$1" url="$2"
            local headers body status
            headers="$(mktemp)"
            body="$(mktemp)"
            status="$(curl -sS -L --max-redirs 8 --connect-timeout 10 --max-time 45 -D "$headers" -o "$body" -w '%{http_code}' "$url")"
            echo "=== $name status=$status ==="
            grep -Ei '^(x-vercel-|server:|age:|cache-control:|location:)' "$headers" || true
            echo -n 'deployment tokens: '
            grep -Eo 'dpl_[A-Za-z0-9]+' "$body" | sort -u | head -10 | tr '\n' ' ' || true
            echo
          }
          inspect homepage https://www.masseurmatch.com/
          inspect canonical-city https://www.masseurmatch.com/ca/san-francisco
