name: Format Admin parity once

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/admin-launch-parity
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec prettier --write
          apps/admin/src/app/admin/analytics/page.tsx
          apps/admin/src/app/admin/billing/page.tsx
          apps/admin/src/app/admin/people/[id]/actions.ts
          apps/admin/src/app/admin/people/[id]/page.tsx
          apps/admin/src/app/admin/people/page.tsx
          apps/admin/src/lib/admin-insights.ts
          apps/admin/src/lib/admin-profile.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin/src/app/admin/analytics/page.tsx apps/admin/src/app/admin/billing/page.tsx 'apps/admin/src/app/admin/people/[id]/actions.ts' 'apps/admin/src/app/admin/people/[id]/page.tsx' apps/admin/src/app/admin/people/page.tsx apps/admin/src/lib/admin-insights.ts apps/admin/src/lib/admin-profile.ts
          git commit -m "style(admin): format launch parity pages"
          git push origin HEAD:feat/admin-launch-parity
