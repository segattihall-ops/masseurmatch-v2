name: Format AI Coach once

on:
  push:
    branches:
      - feat/ai-coach-live-parity

permissions:
  contents: write

concurrency:
  group: format-ai-coach-once
  cancel-in-progress: true

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, 'fix(dashboard): format AI Coach') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ai-coach-live-parity
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format AI Coach
        run: pnpm exec prettier --write apps/dashboard/src/components/pro/ai-coach.tsx

      - name: Commit formatter result and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/format-ai-coach-once.yml
          git add apps/dashboard/src/components/pro/ai-coach.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(dashboard): format AI Coach"
          git push origin HEAD:feat/ai-coach-live-parity
