name: Format Diagnostic

on:
  push:
    branches: [legal/paypal-terms-20260822]

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  format-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format refund policy
        run: pnpm exec prettier --write apps/web/src/app/refund-policy/page.tsx

      - name: Print exact formatted refund policy
        run: |
          echo '---BEGIN-FORMATTED-REFUND-POLICY---'
          cat apps/web/src/app/refund-policy/page.tsx
          echo '---END-FORMATTED-REFUND-POLICY---'
