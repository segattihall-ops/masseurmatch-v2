name: Format manual identity files

on:
  push:
    branches:
      - fix/manual-only-identity-verification

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/manual-only-identity-verification
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec prettier --write
          apps/dashboard/src/app/admin/verifications/manual/page.tsx
          apps/dashboard/src/lib/identity-status.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/dashboard/src/app/admin/verifications/manual/page.tsx apps/dashboard/src/lib/identity-status.ts
          git commit -m "style(identity): format manual verification files"
          git push origin HEAD:fix/manual-only-identity-verification
