name: Format PayPal launch guard once

on:
  push:
    branches:
      - fix/launch-paypal-plan-price-guard

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/launch-paypal-plan-price-guard
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec prettier --write
          apps/dashboard/src/app/subscription/actions.ts
          packages/billing/tests/paypal-plan-configuration.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/dashboard/src/app/subscription/actions.ts packages/billing/tests/paypal-plan-configuration.test.ts
          git commit -m "style(billing): format PayPal launch guard"
          git push origin HEAD:fix/launch-paypal-plan-price-guard
