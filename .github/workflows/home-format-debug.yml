name: Homepage format debug

on:
  pull_request:

permissions:
  contents: write

jobs:
  format-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply Prettier
        run: pnpm exec prettier apps/web/src/components/home/home-showcase-sections.tsx apps/web/src/components/therapist-card.tsx --write
      - name: Commit formatting when needed
        run: |
          if git diff --quiet -- apps/web/src/components/home/home-showcase-sections.tsx apps/web/src/components/therapist-card.tsx; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/components/home/home-showcase-sections.tsx apps/web/src/components/therapist-card.tsx
          git commit -m "style(home): apply Prettier"
          git push origin HEAD:${{ github.head_ref }}
