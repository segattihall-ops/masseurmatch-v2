name: Homepage format debug

on:
  pull_request:

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print Prettier diff
        run: |
          pnpm exec prettier apps/web/src/components/home/home-showcase-sections.tsx apps/web/src/components/therapist-card.tsx --write
          git diff -- apps/web/src/components/home/home-showcase-sections.tsx apps/web/src/components/therapist-card.tsx
