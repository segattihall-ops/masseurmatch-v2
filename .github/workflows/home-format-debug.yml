name: Homepage format debug

on:
  pull_request:

permissions:
  contents: read

jobs:
  format-output:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print formatted homepage sections
        run: |
          pnpm exec prettier apps/web/src/components/home/home-sections.tsx --write
          echo '---FORMATTED-HOME-SECTIONS-START---'
          cat apps/web/src/components/home/home-sections.tsx
          echo '---FORMATTED-HOME-SECTIONS-END---'
