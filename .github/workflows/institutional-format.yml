name: Institutional formatter

on:
  push:
    branches: [feature/institutional-pages-rebuild]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/institutional-pages-rebuild
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format institutional files
        run: >-
          pnpm exec prettier --write
          apps/web/src/app/about/page.tsx
          apps/web/src/app/advertise/page.tsx
          apps/web/src/app/contact/page.tsx
          apps/web/src/app/faq/page.tsx
          apps/web/src/app/for-therapists/page.tsx
          apps/web/src/app/how-it-works/page.tsx
          apps/web/src/app/near-me/page.tsx
          apps/web/src/app/pricing/page.tsx
          apps/web/src/app/safety/page.tsx
          apps/web/src/app/trust/page.tsx
          apps/web/src/app/verification/page.tsx
          apps/web/src/components/institutional/institutional-page.tsx
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/app apps/web/src/components/institutional/institutional-page.tsx
          if git diff --cached --quiet; then
            echo "No formatting changes needed."
          else
            git commit -m "style(web): format institutional rebuild"
            git push origin HEAD:feature/institutional-pages-rebuild
          fi
