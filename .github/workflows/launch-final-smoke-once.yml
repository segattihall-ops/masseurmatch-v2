name: Launch final smoke

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

jobs:
  smoke:
    if: github.head_ref == 'fix/launch-final-verification'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/launch-final-verification

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Discover public Supabase credentials from the public client bundle
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN="https://www.masseurmatch.com"
          HTML="$(curl -fsSL "$ORIGIN")"
          printf '%s' "$HTML" > /tmp/mm-public-bundle.txt
          printf '%s' "$HTML" \
            | grep -oE 'src="[^"]+\.js[^"]*"' \
            | sed -E 's/^src="//; s/"$//' \
            | sort -u > /tmp/mm-scripts.txt || true

          while IFS= read -r src; do
            [ -n "$src" ] || continue
            case "$src" in
              http*) url="$src" ;;
              /*) url="$ORIGIN$src" ;;
              *) url="$ORIGIN/$src" ;;
            esac
            curl -fsSL "$url" >> /tmp/mm-public-bundle.txt || true
          done < /tmp/mm-scripts.txt

          python3 <<'PY' > /tmp/mm-public-env
          import base64
          import json
          import re
          from pathlib import Path

          text = Path('/tmp/mm-public-bundle.txt').read_text(errors='ignore').replace('\\/', '/')
          urls = re.findall(r'https://[a-z0-9-]+\.supabase\.co', text, re.I)
          if not urls:
              raise SystemExit('Could not discover the public Supabase URL from the production client bundle.')

          publishable = re.findall(r'sb_publishable_[A-Za-z0-9._-]+', text)
          key = publishable[0] if publishable else None
          if not key:
              for candidate in re.findall(r'eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+', text):
                  try:
                      payload = candidate.split('.')[1]
                      payload += '=' * (-len(payload) % 4)
                      decoded = json.loads(base64.urlsafe_b64decode(payload))
                  except Exception:
                      continue
                  if decoded.get('role') == 'anon':
                      key = candidate
                      break
          if not key:
              raise SystemExit('Could not discover the public Supabase anon/publishable key from the client bundle.')

          print(f'NEXT_PUBLIC_SUPABASE_URL={urls[0]}')
          print(f'NEXT_PUBLIC_SUPABASE_ANON_KEY={key}')
          PY

          for app in web dashboard; do
            cp /tmp/mm-public-env "apps/$app/.env.local"
          done

      - name: Build web and dashboard production apps
        run: |
          pnpm --filter @masseurmatch/web build
          pnpm --filter @masseurmatch/dashboard build

      - name: Install Chromium for Playwright
        run: |
          pnpm exec playwright install --with-deps chromium
          CHROME="$(find "$HOME/.cache/ms-playwright" -type f -name chrome -perm -111 | head -1)"
          test -n "$CHROME"
          sudo mkdir -p /opt/pw-browsers/chromium-1194/chrome-linux
          sudo ln -sf "$CHROME" /opt/pw-browsers/chromium-1194/chrome-linux/chrome

      - name: Run production smoke and launch-critical Playwright suite
        run: pnpm smoke
