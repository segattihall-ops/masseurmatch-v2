name: Prettier Fix Home

on:
  push:
    branches:
      - fix/home-institutional-visual-system

permissions:
  contents: write

jobs:
  format-home:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/home-institutional-visual-system
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format homepage files
        run: >-
          pnpm exec prettier --write
          apps/web/src/app/page.tsx
          apps/web/src/components/home/home-showcase-sections.tsx
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/app/page.tsx apps/web/src/components/home/home-showcase-sections.tsx
          git commit -m "chore(web): format homepage styles"
          git push origin HEAD:fix/home-institutional-visual-system
