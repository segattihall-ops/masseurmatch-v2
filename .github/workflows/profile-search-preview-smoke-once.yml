name: Profile and search preview smoke once

on:
  push:
    branches:
      - feature/public-profile-search-parity

permissions:
  contents: write

concurrency:
  group: profile-search-preview-smoke
  cancel-in-progress: true

jobs:
  smoke:
    if: ${{ !contains(github.event.head_commit.message, 'chore: remove profile search preview smoke') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/public-profile-search-parity
          fetch-depth: 0

      - name: Verify requested preview behavior
        shell: bash
        env:
          WEB: https://masseurmatch-v2-git-feature-public-profile-se-330e08-mm-website.vercel.app
          DASHBOARD: https://masseurmatch-v2-kftd-git-feature-public-profi-bd2022-mm-website.vercel.app
        run: |
          set -euo pipefail

          body="$(mktemp)"
          ready=0
          for attempt in $(seq 1 30); do
            status="$(curl -sS -L --connect-timeout 10 --max-time 30 -o "$body" -w '%{http_code}' "$WEB/compare" || true)"
            if [ "$status" = "200" ] && grep -Fq "Compare MasseurMatch with other massage directories" "$body"; then
              ready=1
              break
            fi
            sleep 10
          done
          if [ "$ready" != "1" ]; then
            echo "::error::Branch preview did not become ready with the current compare page."
            head -c 1800 "$body" || true
            exit 1
          fi

          require_page() {
            local name="$1" url="$2"
            shift 2
            local page status
            page="$(mktemp)"
            status="$(curl -sS -L --connect-timeout 10 --max-time 40 -o "$page" -w '%{http_code}' "$url")"
            echo "$name status=$status"
            if [ "$status" != "200" ]; then
              echo "::error::$name expected 200, got $status"
              head -c 1800 "$page" || true
              exit 1
            fi
            for marker in "$@"; do
              if ! grep -Fqi "$marker" "$page"; then
                echo "::error::$name missing marker: $marker"
                head -c 1800 "$page" || true
                exit 1
              fi
            done
          }

          require_page "compare hub" "$WEB/compare" \
            "MasseurFinder" "RentMasseur" "Most compared"

          require_page "search" "$WEB/search" \
            "Find near me" "Nearby radius" "Featured profiles" "Offers & discounts" \
            "Nearest" "Most reviewed"

          headers="$(curl -sS -I --connect-timeout 10 --max-time 30 "$WEB/search" | tr -d '\r' | tr '[:upper:]' '[:lower:]')"
          echo "$headers" | grep -F "permissions-policy:" | grep -F "geolocation=(self)"

          require_page "Bruno public profile" "$WEB/tx/dallas/bruno-3890ba48" \
            "Ask Knotty" "Want to contact Bruno?" "Therapists near Dallas" \
            "Read review" "Service area" "openstreetmap.org"

          concierge_body="$(mktemp)"
          concierge_status="$(curl -sS --connect-timeout 10 --max-time 60 -o "$concierge_body" -w '%{http_code}' \
            -X POST -H 'content-type: application/json' \
            --data '{"message":"What city is this provider in?","profileId":"3890ba48-4376-4609-9b1c-f0f9cf5e7634"}' \
            "$WEB/api/concierge")"
          echo "profile Knotty status=$concierge_status"
          if [ "$concierge_status" != "200" ] || ! grep -Fq '"reply"' "$concierge_body"; then
            echo "::error::Profile-specific Knotty did not return a reply."
            cat "$concierge_body"
            exit 1
          fi

          video_body="$(mktemp)"
          video_status="$(curl -sS --connect-timeout 10 --max-time 30 -o "$video_body" -w '%{http_code}' \
            -X POST "$DASHBOARD/api/uploads/video")"
          echo "anonymous video upload ticket status=$video_status"
          case "$video_status" in
            401|403) ;;
            *)
              echo "::error::Anonymous visitor was not blocked from profile-video upload: $video_status"
              cat "$video_body"
              exit 1
              ;;
          esac

          echo "Targeted preview smoke passed."

      - name: Remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/profile-search-preview-smoke-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove profile search preview smoke"
          git push origin HEAD:feature/public-profile-search-parity
