name: SEO format preview

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply exact Prettier output
        run: |
          pnpm exec prettier --write \
            'apps/web/src/app/[state]/[city]/page.tsx' \
            apps/web/src/app/gay-massage/page.tsx \
            apps/web/src/app/near-me/page.tsx \
            apps/web/src/app/therapists/page.tsx
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            'apps/web/src/app/[state]/[city]/page.tsx' \
            apps/web/src/app/gay-massage/page.tsx \
            apps/web/src/app/near-me/page.tsx \
            apps/web/src/app/therapists/page.tsx
          git commit -m "style(web): format SEO landing pages"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
