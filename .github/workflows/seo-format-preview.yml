name: SEO format preview

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate exact Prettier diff
        run: |
          pnpm exec prettier --write \
            'apps/web/src/app/[state]/[city]/page.tsx' \
            apps/web/src/app/gay-massage/page.tsx \
            apps/web/src/app/near-me/page.tsx \
            apps/web/src/app/therapists/page.tsx
          git diff -- \
            'apps/web/src/app/[state]/[city]/page.tsx' \
            apps/web/src/app/gay-massage/page.tsx \
            apps/web/src/app/near-me/page.tsx \
            apps/web/src/app/therapists/page.tsx
