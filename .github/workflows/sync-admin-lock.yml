name: Sync admin lockfile once

on:
  push:
    branches: [refactor/admin-standalone]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/admin-standalone
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Add admin importer to lockfile
        run: pnpm install --lockfile-only
      - name: Remove one-shot workflow and commit lockfile
        run: |
          rm .github/workflows/sync-admin-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml .github/workflows/sync-admin-lock.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(admin): sync workspace lockfile"
          git push origin HEAD:refactor/admin-standalone
