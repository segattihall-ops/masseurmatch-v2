name: Temporary Professional License Formatter

on:
  push:
    branches:
      - feat/professional-license-verification

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/professional-license-verification
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format professional license files
        run: >-
          pnpm exec prettier --write
          apps/admin/src/app/admin/verifications/actions.ts
          apps/admin/src/app/admin/verifications/page.tsx
          apps/admin/src/app/admin/verifications/queue.tsx
          apps/dashboard/src/app/admin/verifications/actions.ts
          apps/dashboard/src/app/admin/verifications/queue.tsx
          apps/dashboard/src/app/api/provider/verification/license/route.ts
          apps/dashboard/src/app/pro/trust/license-form.tsx
          apps/dashboard/src/app/pro/trust/page.tsx
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/admin/src/app/admin/verifications/actions.ts \
            apps/admin/src/app/admin/verifications/page.tsx \
            apps/admin/src/app/admin/verifications/queue.tsx \
            apps/dashboard/src/app/admin/verifications/actions.ts \
            apps/dashboard/src/app/admin/verifications/queue.tsx \
            apps/dashboard/src/app/api/provider/verification/license/route.ts \
            apps/dashboard/src/app/pro/trust/license-form.tsx \
            apps/dashboard/src/app/pro/trust/page.tsx
          git commit -m "chore: format professional license workflow"
          git push origin HEAD:feat/professional-license-verification
