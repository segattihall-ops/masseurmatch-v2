name: Vercel domain cutover capability check once

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Confirm repository has a usable Vercel token
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::error::VERCEL_TOKEN repository secret is not configured. Domain cutover cannot be automated from GitHub Actions."
            exit 2
          fi

          response="$(mktemp)"
          status="$(curl -sS --connect-timeout 10 --max-time 30 -o "$response" -w '%{http_code}' \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            'https://api.vercel.com/v9/projects/masseurmatch-v2?teamId=team_srSjjkFDYeFA6HpxgpvxPgox')"
          echo "Vercel project API status=$status"
          if [ "$status" != "200" ]; then
            echo "::error::VERCEL_TOKEN exists but cannot access the MM website / masseurmatch-v2 project."
            exit 3
          fi

          echo "Usable Vercel token found; automated domain cutover is possible."
