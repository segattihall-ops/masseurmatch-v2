name: Homepage visual QA

on:
  push:
    branches:
      - feature/homepage-photo-motion-fix

permissions:
  contents: read

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Capture responsive homepage
        run: |
          mkdir -p visual-qa

          SUPABASE_KEY_PREFIX='sb_publishable_'
          SUPABASE_KEY_BODY='SnBq62riIQi-RvKxIlshyw_YnK_X68M'
          cat > apps/web/.env.local <<EOF
          NEXT_PUBLIC_SITE_URL=http://127.0.0.1:3000
          NEXT_PUBLIC_DASHBOARD_URL=http://127.0.0.1:3001
          NEXT_PUBLIC_SUPABASE_URL=https://ijsdpozjfjjufjsoexod.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY=${SUPABASE_KEY_PREFIX}${SUPABASE_KEY_BODY}
          EOF

          pnpm --filter @masseurmatch/web dev > /tmp/masseurmatch-web.log 2>&1 &
          WEB_PID=$!
          trap 'kill ${WEB_PID} 2>/dev/null || true' EXIT

          ready=0
          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            cat /tmp/masseurmatch-web.log
            exit 1
          fi

          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || true)"
          if [ -z "$CHROME_PATH" ]; then
            echo "System Chrome was not found on the runner."
            exit 1
          fi
          export CHROME_PATH

          node --input-type=module <<'EOF'
          import { chromium } from '@playwright/test';
          import fs from 'node:fs/promises';

          const url = 'http://127.0.0.1:3000';
          const viewports = [
            { name: '320x568', width: 320, height: 568 },
            { name: '375x667', width: 375, height: 667 },
            { name: '430x932', width: 430, height: 932 },
            { name: '768x1024', width: 768, height: 1024 },
            { name: '1024x768', width: 1024, height: 768 },
            { name: '1440x900', width: 1440, height: 900 },
          ];

          const browser = await chromium.launch({
            executablePath: process.env.CHROME_PATH,
            headless: true,
          });
          const results = [];

          for (const viewport of viewports) {
            const page = await browser.newPage({ viewport });
            const errors = [];
            page.on('pageerror', (error) => errors.push(error.message));
            page.on('console', (message) => {
              if (message.type() === 'error') errors.push(message.text());
            });

            await page.goto(url, { waitUntil: 'networkidle', timeout: 60_000 });
            await page.screenshot({ path: `visual-qa/${viewport.name}-fold.png` });

            const layout = await page.evaluate(() => {
              const h1 = document.querySelector('h1');
              const h2 = document.querySelector('h2');
              const hero = h1?.closest('section');
              const h1Box = h1?.getBoundingClientRect();
              const h2Box = h2?.getBoundingClientRect();
              const heroBox = hero?.getBoundingClientRect();
              const overflowingElements = Array.from(document.querySelectorAll('body *'))
                .map((element) => ({ element, rect: element.getBoundingClientRect() }))
                .filter(({ rect }) => rect.right > window.innerWidth + 1 || rect.left < -1)
                .slice(0, 10)
                .map(({ element, rect }) => ({
                  tag: element.tagName.toLowerCase(),
                  className: element.getAttribute('class'),
                  left: rect.left,
                  right: rect.right,
                  width: rect.width,
                }));

              return {
                viewportWidth: window.innerWidth,
                viewportHeight: window.innerHeight,
                h1Left: h1Box?.left ?? null,
                h2Left: h2Box?.left ?? null,
                heroBottom: heroBox?.bottom ?? null,
                heroFitsViewport: heroBox ? heroBox.bottom <= window.innerHeight + 2 : false,
                headingsOnLeft:
                  Boolean(h1Box && h2Box) &&
                  h1Box.left < window.innerWidth / 2 &&
                  h2Box.left < window.innerWidth / 2,
                headingsAligned:
                  Boolean(h1Box && h2Box) && Math.abs(h1Box.left - h2Box.left) <= 2,
                horizontalOverflow: document.documentElement.scrollWidth > window.innerWidth + 1,
                overflowingElements,
                scrollBehavior: getComputedStyle(document.documentElement).scrollBehavior,
              };
            });

            const images = page.locator('#explore-home img');
            const imageCount = await images.count();
            const photoChecks = [];

            for (let index = 0; index < Math.min(6, imageCount); index += 1) {
              const image = images.nth(index);
              await image.scrollIntoViewIfNeeded({ timeout: 15_000 });
              await page.waitForTimeout(150);
              let loaded = true;
              try {
                await page.waitForFunction(
                  (photoIndex) => {
                    const photo = document.querySelectorAll('#explore-home img')[photoIndex];
                    return photo instanceof HTMLImageElement && photo.complete && photo.naturalWidth > 0;
                  },
                  index,
                  { timeout: 15_000 },
                );
              } catch {
                loaded = false;
              }

              photoChecks.push(
                await image.evaluate((photo, isLoaded) => ({
                  loaded: isLoaded && photo.complete && photo.naturalWidth > 0,
                  source: photo.currentSrc || photo.getAttribute('src'),
                  naturalWidth: photo.naturalWidth,
                  naturalHeight: photo.naturalHeight,
                }), loaded),
              );
            }

            await page.locator('#explore-home').scrollIntoViewIfNeeded({ timeout: 15_000 });
            await page.screenshot({ path: `visual-qa/${viewport.name}-featured.png` });

            const photos = {
              imageCount,
              loadedCount: photoChecks.filter((photo) => photo.loaded).length,
              sources: photoChecks.map((photo) => photo.source),
              checks: photoChecks,
            };

            results.push({ viewport, layout, photos, errors });
            await page.close();
          }

          await browser.close();
          await fs.writeFile('visual-qa/results.json', JSON.stringify(results, null, 2));

          const failures = results.flatMap((result) => {
            const messages = [];
            if (!result.layout.headingsOnLeft) messages.push(`${result.viewport.name}: headings not left`);
            if (!result.layout.headingsAligned) messages.push(`${result.viewport.name}: headings not aligned`);
            if (!result.layout.heroFitsViewport) messages.push(`${result.viewport.name}: hero exceeds viewport`);
            if (result.layout.horizontalOverflow) {
              messages.push(`${result.viewport.name}: horizontal overflow ${JSON.stringify(result.layout.overflowingElements)}`);
            }
            if (result.layout.scrollBehavior !== 'smooth') messages.push(`${result.viewport.name}: smooth scroll missing`);
            if (result.photos.imageCount < 6) messages.push(`${result.viewport.name}: expected 6 profile images, found ${result.photos.imageCount}`);
            if (result.photos.loadedCount < 6) messages.push(`${result.viewport.name}: expected 6 loaded profile images, found ${result.photos.loadedCount}`);
            if (result.errors.length > 0) messages.push(`${result.viewport.name}: browser errors: ${result.errors.join(' | ')}`);
            return messages;
          });

          if (failures.length > 0) {
            console.error(failures.join('\n'));
            process.exit(1);
          }
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homepage-visual-qa
          path: visual-qa
          if-no-files-found: error
